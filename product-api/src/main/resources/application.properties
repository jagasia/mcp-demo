spring.application.name=product-api

# Elastic Beanstalk's nginx proxy forwards port 80 -> 5000
server.port=5000

# H2 file-based database (stored in ./data next to the jar)
spring.datasource.url=jdbc:h2:file:./data/productdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console: http://localhost:5000/h2-console (local only; remote access stays blocked)
spring.h2.console.enabled=true
