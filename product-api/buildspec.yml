version: 0.2

# The GitHub repo (mcp-demo) holds several projects; this app lives in product-api/.
# CodeBuild starts at the repo root, so every path below starts with product-api/.

phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - echo "Java and Maven versions"
      - java -version
      - mvn -v
  build:
    commands:
      - echo "Running tests and packaging the jar"
      - mvn -f product-api/pom.xml clean package
  post_build:
    commands:
      - echo "Build finished"
      - ls -l product-api/target/*.jar

# Show JUnit results in the CodeBuild "Reports" tab
reports:
  junit-reports:
    base-directory: product-api/target/surefire-reports
    files:
      - "TEST-*.xml"
    file-format: JUNITXML

# What gets handed to Elastic Beanstalk: the jar + Procfile at the zip root
artifacts:
  files:
    - product-api/target/product-api.jar
    - product-api/Procfile
  discard-paths: yes

# Reuse downloaded Maven dependencies between builds
cache:
  paths:
    - "/root/.m2/**/*"
